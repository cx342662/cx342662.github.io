function createActor(){const skin=mat(0xb7a36a),scaleMat=mat(0x7a8656),belly=mat(0xd3b577),lineMat=mat(0x68583d),shirt=mat(0x101216,.05),gold=mat(0xefbd4c,.78,.22),brown=mat(0x675135);actor=new THREE.Group();pivot.add(actor);torso=ball(actor,1,belly,0,2.02,.26,1.04,1.32,.72);const panel=ball(actor,.9,mat(0xdfc28b),0,2.03,.76,.98,1.22,.16);for(let y=1.45;y<=2.7;y+=.41){let m=box(actor,1.55,.035,.038,lineMat,0,y,.91);m.rotation.z=(y-2)*.04}for(let x of [-.52,.52])box(actor,.03,2,.038,lineMat,x,2,.90);let coll=ball(actor,.57,shirt,0,3.1,.07,1.7,.25,.9);const left=box(actor,.38,.93,.25,shirt,-.77,2.56,.37);left.rotation.z=-.31;const right=box(actor,.38,.93,.25,shirt,.77,2.56,.37);right.rotation.z=.31;for(let s of [-1,1]){let armGroup=new THREE.Group();armGroup.position.set(s*.93,2.62,.08);actor.add(armGroup);arms.push(armGroup);let arm=ball(armGroup,.32,scaleMat,s*.12,-.48,.13,.8,1.63,.9);arm.rotation.z=s*.28;ball(armGroup,.22,skin,s*.22,-.99,.18,1.05,.7,1);for(let k=0;k<6;k++)ball(armGroup,.065,skin,s*(.14+k*.025),-.5+(k%3)*.21,.40,.75,.8,.5)}for(let s of [-1,1]){let lg=new THREE.Group();lg.position.set(s*.54,1.25,0);actor.add(lg);legs.push(lg);ball(lg,.35,scaleMat,s*.09,-.45,.07,.95,1.58,1);ball(lg,.29,scaleMat,s*.09,-1.02,.32,1.22,.55,1.7);for(let i=-1;i<=1;i++)ball(lg,.09,skin,s*.09+i*.19,-1.16,.75,1,.6,1.65)}shell=new THREE.Group();shell.position.set(0,2.09,-.50);actor.add(shell);ball(shell,1.05,brown,0,0,-.36,1.04,1.24,.76);ball(shell,.95,mat(0x927045),0,0,-.78,.97,1.15,.2);const shellLines=mat(0x2f281f);for(let yy=-.8;yy<=.8;yy+=.43){let m=torus(shell,Math.sqrt(Math.max(.1,1.03-yy*yy))*.9,.023,shellLines,0,yy,-.97);m.scale.y=.44}for(let ang=0;ang<Math.PI*2;ang+=Math.PI/4){let line=box(shell,.026,1.75,.032,shellLines,Math.cos(ang)*.47,0,-.966+Math.sin(ang)*.02);line.rotation.z=-ang*.24}head=new THREE.Group();head.position.set(0,3.75,.3);actor.add(head);ball(head,.68,mat(0xd9aa82),0,.01,0,1.05,1.13,.91);for(let s of [-1,1]){ball(head,.12,mat(0xe8aa87),s*.67,-.01,.04,.7,1,1);torus(head,.105,.028,gold,s*.71,-.08,.15,.18)}let texture=new THREE.TextureLoader().load(faceImg);texture.colorSpace=THREE.SRGBColorSpace;face=mesh(new THREE.PlaneGeometry(1.16,1.42),new THREE.MeshBasicMaterial({map:texture,transparent:true,side:THREE.DoubleSide,depthWrite:false}),head,0,-.04,.61);face.scale.set(1.04,1.02,1);const neck=tube(actor,.31,.35,.34,skin,0,3.31,.29);let chain=torus(actor,.46,.053,gold,0,3.18,.68,.3);chain.scale.y=.68;for(let i=0;i<5;i++)ball(actor,.052,gold,(i-2)*.12,2.91+Math.abs(i-2)*.04,.72);const necklace=ball(actor,.09,gold,0,2.87,.76);visor=new THREE.Group();head.add(visor);let shield=ball(visor,.72,mat(0x20242a,.6,.32),0,.23,.27,1.12,.83,.8);visor.visible=false;actor.position.y=.12}
function sceneClear(){while(environment.children.length){let obj=environment.children[0];environment.remove(obj)}particles=[];water=[];visor.visible=false;actor.visible=true;actor.position.set(0,.12,0);actor.rotation.set(0,0,0);pivot.position.set(0,0,0);head.rotation.set(0,0,0);for(let a of arms)a.rotation.set(0,0,0);for(let l of legs)l.rotation.set(0,0,0);scene.background.setHex(0x151b29)}
function bed(x,z,ma){box(environment,2.65,.35,1.7,mat(0x715741),x,.55,z);for(let i of [-1,1])for(let j of [-1,1])box(environment,.17,.65,.17,mat(0x564335),x+i*1.16,.2,z+j*.72);box(environment,2.5,.2,1.48,mat(0xecd8bd),x,.82,z);box(environment,.7,.15,.5,mat(0xfff4e4),x-.78,.98,z-.25);box(environment,1.6,.15,1.35,ma,x+.38,1.04,z+.16)}
function buildScene(n){const T=THREE,ma=mat;sceneClear();const prop=environment;let lamp=new T.PointLight(chapters[n].color,22,10);lamp.position.set(-2,5,2);prop.add(lamp);if(n===0||n===4){bed(-2.0,-.35,ma(n===0?0x657895:0x4f5a89));actor.position.set(0,.12,.8);box(prop,1.0,.95,.85,ma(0x645644),-3.65,.48,.6);box(prop,.7,.11,.5,ma(0xf5d6a1),-3.65,1.03,.6);let clock=textSprite(n===0?'06:30':'22:30','#ff8f85',54);clock.position.set(-3.65,1.5,.72);clock.scale.set(1.1,.4,1);prop.add(clock);box(prop,2.8,2.2,.14,ma(n===0?0x71849a:0x344565),2.65,1.7,-2.6);let moon=ball(prop,.42,ma(n===0?0xf2ba6b:0xf3e9bb),2.3,2.25,-2.48);for(let i=0;i<14;i++)ball(prop,.028,ma(0xfaf4da),1.5+Math.random()*2.1,.8+Math.random()*2.3,-2.45)}else if(n===1){actor.position.set(-.1,.1,.75);box(prop,3.6,.21,1.2,ma(0x616971,.7,.32),1.15,1.22,1.25);for(let x of [-.3,2.4])tube(prop,.1,.14,1.22,ma(0x373f44),x,.61,1.1);beam=box(prop,2.5,.33,.38,ma(0x9e9fa0,.7,.3),1.08,1.54,1.16);beam.rotation.y=.16;for(let i=0;i<5;i++){let spark=ball(prop,.065,new T.MeshBasicMaterial({color:0xffaa46}),1.05,1.62,1.45);particles.push(spark)}box(prop,1.0,2.4,2.2,ma(0x4d5965),-3.8,1.1,-2.7);box(prop,1.3,1.15,.3,ma(0x6b777f),2.95,.58,-2.1);let txt=textSprite('安全第一','#f5db72');txt.position.set(0,4.7,-2.0);prop.add(txt)}else if(n===2){actor.position.set(0,.12,.8);tableTop=box(prop,2.65,.17,1.5,ma(0x95775a),0,1.15,2.17);for(let x of [-1,1])for(let z of [-1,1])box(prop,.13,1.13,.13,ma(0x6c5241),x, .55,2.17+z*.6);let plate=mesh(new T.CylinderGeometry(.63,.5,.1,32),ma(0xf1ead7),prop,0,1.3,2.18);for(let i=0;i<4;i++){let poo=mesh(new T.TorusGeometry(.38-i*.08,.12-i*.015,12,28),ma(0x6b391f),prop,0,1.44+i*.17,2.17);poo.rotation.x=Math.PI/2}let tip=mesh(new T.ConeGeometry(.10,.19,20),ma(0x6b391f),prop,0,2.12,2.17);let sign=textSprite('💩 今日特餐','#ffe6b4',52);sign.position.set(0,4.7,-1);prop.add(sign)}else if(n===3){actor.position.set(0,.1,.4);box(prop,3.1,.14,2.7,ma(0xdee7e9),0,.13,0);for(let i=0;i<6;i++)box(prop,.02,2.6,2.5,ma(0xc5d8dc),-3+i*.95,1.25,-2.7);tube(prop,.07,.07,2.5,ma(0xb7c1c6,.6),1.72,2.55,.3);let shower=mesh(new T.CylinderGeometry(.6,.6,.13,25),ma(0xb5c1c8,.9,.2),prop,1.35,3.9,.33);for(let i=0;i<42;i++){let droplet=ball(prop,.025,ma(0x9ce7f5,.2,.06),.65+Math.random()*1.4,1+Math.random()*2.7,-.05+Math.random()*.9);water.push(droplet)}for(let i=0;i<25;i++){let bub=ball(prop,.07+Math.random()*.11,new T.MeshPhysicalMaterial({color:0xc5f8ff,transparent:true,opacity:.62,roughness:.1,metalness:.05}),-1.0+Math.random()*2,1+Math.random()*2,Math.random()*1.2);water.push(bub)}}
}
function setScene(n){idx=n;elapsed=0;lastSceneTime=performance.now();buildScene(n);document.getElementById('name').textContent=chapters[n].name;document.getElementById('desc').textContent=chapters[n].desc;document.getElementById('clock').textContent=chapters[n].time;document.querySelectorAll('.sceneBtn').forEach((b,i)=>b.classList.toggle('active',i===n))}
function setupUI(){let el=document.getElementById('timeline');chapters.forEach((c,i)=>{let btn=document.createElement('button');btn.className='sceneBtn';btn.innerHTML=`<span class="emoji">${c.icon}</span><span class="btnLabel">${c.name}</span>`;btn.onclick=()=>setScene(i);el.appendChild(btn)});document.getElementById('auto').onclick=()=>{autoplay=!autoplay;document.getElementById('auto').textContent=autoplay?'⏸':'▶';document.getElementById('auto').classList.toggle('on',autoplay)};document.getElementById('reset').onclick=()=>{yaw=.34;pitch=.09;dist=9.5};document.getElementById('zoomIn').onclick=()=>dist=clamp(dist-.9,5.5,16);document.getElementById('zoomOut').onclick=()=>dist=clamp(dist+.9,5.5,16)}
function setupTouch(){let dom=renderer.domElement;dom.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;dom.setPointerCapture(e.pointerId)});dom.addEventListener('pointermove',e=>{if(!dragging)return;yaw+=(e.clientX-lastX)*.008;pitch=clamp(pitch+(e.clientY-lastY)*.004,-.33,.58);lastX=e.clientX;lastY=e.clientY});dom.addEventListener('pointerup',()=>dragging=false);dom.addEventListener('wheel',e=>{dist=clamp(dist+e.deltaY*.007,5.5,16);e.preventDefault()},{passive:false});dom.addEventListener('touchmove',e=>{if(e.touches.length===2){let a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinchDist)dist=clamp(dist+(pinchDist-d)*.015,5.5,16);pinchDist=d}},{passive:true});dom.addEventListener('touchend',()=>pinchDist=0)}
function onresize(){let w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.fov=w<h?47:39;camera.updateProjectionMatrix();renderer.setSize(w,h);}
function animate(){requestAnimationFrame(animate);let dt=Math.min(clockThree.getDelta(),.06);elapsed+=dt;let t=elapsed;let ty=2.0+(innerWidth<700?.4:0);camera.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,ty+Math.sin(pitch)*dist*.65,Math.cos(yaw)*Math.cos(pitch)*dist);camera.lookAt(0,ty,0);actor.position.y=.12+Math.sin(t*2)*.045;head.rotation.y=Math.sin(t*.9)*.08;arms[0].rotation.z=Math.sin(t*2)*.13;arms[1].rotation.z=-Math.sin(t*2)*.13;legs[0].rotation.z=Math.sin(t*1.9)*.055;legs[1].rotation.z=-Math.sin(t*1.9)*.055;if(idx===0){head.rotation.z=.08*Math.sin(t);arms[0].rotation.z=-.65+Math.sin(t*2)*.15;arms[1].rotation.z=.65-Math.sin(t*2)*.15;}if(idx===1){arms[1].rotation.x=-.8;arms[1].rotation.z=-.65;visor.visible=true;visor.position.y=.3;for(let i=0;i<particles.length;i++){let a=i*2.4+t*9;particles[i].position.set(1.05+Math.cos(a)*(t%1.5)*.8,1.6+Math.sin(a)*.7+((t+i*.3)%1)*.5,1.45+Math.sin(a*1.3)*.5);particles[i].scale.setScalar(.6+Math.random()*1.5)} }if(idx===2){arms[1].rotation.x=-.7+Math.sin(t*3)*.3;arms[1].rotation.z=-.5+Math.sin(t*3)*.15;head.rotation.x=Math.sin(t*3)*.09}if(idx===3){for(let i=0;i<water.length;i++){let d=water[i];d.position.y-=dt*(.85+i%3*.4);if(d.position.y<.45)d.position.y=3.6+Math.random()*.5}arms[0].rotation.z=Math.sin(t*2)*.48;arms[1].rotation.z=-Math.cos(t*2)*.4}if(idx===4){head.rotation.z=.12;head.rotation.x=.1;arms[0].rotation.z=.24;arms[1].rotation.z=-.24;actor.position.y=.12+Math.sin(t*1.2)*.035}renderer.render(scene,camera);if(autoplay&&performance.now()-lastSceneTime>9000)setScene((idx+1)%5)}
